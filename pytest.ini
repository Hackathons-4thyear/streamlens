[pytest]
# One configuration for the whole repository, at the root where pytest looks
# for it. When this lived in api/ instead, running `pytest` from the root
# found no configuration at all: asyncio_mode was unset, seven async tests
# skipped themselves, and the run still reported success.
testpaths = api/tests
pythonpath = api
addopts = -q
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
